<!doctype html><html><head><meta charset="utf-8"><title>Impact behavior review</title>
<style>*{box-sizing:border-box}body{margin:0;background:#263a35;color:#eee8d7;font:14px system-ui}header{position:absolute;z-index:2;display:flex;gap:12px;padding:15px;align-items:center;background:#263e43ed;width:100%;flex-wrap:wrap}select{font:inherit;padding:7px}canvas{display:block;width:100vw;height:100vh}output{margin-left:auto}</style></head>
<body><header>
<select aria-label="Object" id="object"></select>
<select aria-label="Impact" id="speed"><option value="270">Hard hit</option><option value="30">Gentle touch</option></select>
<select aria-label="Replay time" id="time"><option value="0">Before</option><option value="0.2">0.2 seconds</option><option value="0.6">0.6 seconds</option><option value="1.5">1.5 seconds</option><option value="3">3 seconds</option><option value="7">7 seconds</option></select>
<select aria-label="View" id="view"><option value="0">Front</option><option value="1.57079632679">Right</option><option value="3.14159265359">Back</option><option value="4.71238898038">Left</option></select>
<label><input type="checkbox" id="reduced"> Reduced motion</label><output></output>
</header><canvas></canvas><script type="module" src="./destruction.js"></script></body></html>
