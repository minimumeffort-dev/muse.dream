<!doctype html><html><head><meta charset="utf-8"><title>Dream character motion</title><style>
*{box-sizing:border-box}body{margin:0;background:#ecebe5;color:#242522;font:15px system-ui}header{height:66px;display:flex;gap:18px;align-items:center;padding:16px 28px}h1{font-size:20px;margin:0}select,button{padding:7px;font:inherit}body:has(#media-capture) main{height:900px}main{position:relative;width:100%;height:calc(100vh - 66px);min-height:600px}canvas{width:100%;height:100%;display:block}#labels{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr);pointer-events:none}section{padding:26px;border-left:1px solid #0001}section strong{display:block;font-size:24px}section span{display:block;color:#52574f;margin-top:7px}
</style></head><body><header><h1>Dream · Character motion</h1><select aria-label="View" id="view"><option value="0">Three-quarter</option><option value="1.57079632679">Side</option><option value="3.14159265359">Reverse</option></select><select aria-label="Path" id="path"><option value="straight">Straight</option><option value="turn">Turn and stop</option><option value="reverse">Reverse and stop</option></select><select aria-label="Ground" id="ground"><option value="flat">Flat</option><option value="hill">Hill</option><option value="steps">Steps</option></select><button id="motion">Pause animation</button><input id="phase" aria-label="Phase" type="range" min="0" max="6" step=".033333" value="0"><a href="/docs/examples/humanoid.dream">Dream source</a></header><main><canvas></canvas><div id="labels"><section><strong>Walk</strong><span>Player rig · 1.4 m/s</span></section><section><strong>Crowd walk</strong><span>Instanced rig · 1.4 m/s</span></section><section><strong>Run</strong><span>Player rig · 5.5 m/s</span></section><section><strong>Swim</strong><span>Alternating pull · recovery · flutter kick</span></section></div></main><script type="module" src="./locomotion.js"></script></body></html>
