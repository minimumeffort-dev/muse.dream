<!doctype html>
<html><head><meta charset="utf-8"><title>Dream object gallery</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#243831;color:#eee8d7;font:15px system-ui}
header{padding:20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}h1{font-size:21px;margin:0}
select{padding:7px;font:inherit}a{color:#dfcb86}canvas{position:absolute;top:0;left:0;width:100%;height:100%}
main{position:relative}.grid{position:relative;display:grid;grid-template-columns:repeat(4,1fr);pointer-events:none}
article{height:310px;position:relative;border:1px solid #ffffff16;padding:14px}article strong{position:absolute;bottom:31px;left:14px}
article small{position:absolute;bottom:12px;left:14px;color:#bcc8b5}
body.people{background:#fafaf7;color:#171717}body.people a{color:#685522}body.people article small{color:#57574e}body.people article{border-color:#17171718}
@media(max-width:1100px){.grid{grid-template-columns:repeat(2,1fr)}}
</style></head><body><header><h1>Dream objects</h1>
<select id="view" aria-label="View"><option value="0">Front</option><option value="1.57079632679">Right</option><option value="3.14159265359">Back</option><option value="4.71238898038">Left</option></select>
<select id="phase" aria-label="Animation phase"><option value="0">Phase 0</option><option value="1.5">Phase 1.5</option><option value="3">Phase 3</option><option value="4.5">Phase 4.5</option></select>
<select id="near" aria-label="Proximity"><option value="200">Far</option><option value="0">Near</option></select>
<a href="/src/scene/dream-creations.dream">Source library</a></header>
<main><canvas></canvas><div class="grid"></div></main><script type="module" src="./dream.js"></script></body></html>
