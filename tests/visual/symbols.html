<!doctype html><html lang="en"><head><meta charset="utf-8"><title>World and HUD symbols</title><style>
@font-face{font-family:Manrope;src:url('/docs/site/fonts/manrope-latin.woff2')}@font-face{font-family:Archivo;src:url('/docs/site/fonts/archivo-latin.woff2')}*{box-sizing:border-box}body{margin:0;background:#f7f7f2;color:#171717;font:15px Manrope,sans-serif}main{max-width:1280px;margin:auto;padding:32px}h1{font:700 30px Archivo,sans-serif;margin:0 0 12px}p{margin:8px 0 20px;color:#50534b}.cards{display:flex;gap:16px;margin-bottom:20px}.card{flex:1;padding:20px;background:#20231e;color:#f7f7f2;border-radius:12px}.samples{display:flex;align-items:center;gap:24px;margin-top:20px}.sample{display:flex;align-items:center;gap:10px}svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;color:#ffd245}.small svg{width:18px;height:18px}.large svg{width:32px;height:32px}canvas{display:block;width:100%;height:470px;border:1px solid #c9ccbf;border-radius:12px}nav{display:flex;gap:8px;margin:16px 0}button{font:inherit;border:1px solid #94988c;background:transparent;border-radius:6px;padding:8px 16px;color:inherit;cursor:pointer}button[aria-pressed=true]{background:#171717;color:#f7f7f2}button:focus-visible{outline:3px solid #b06f00;outline-offset:3px}#status{font-size:12px}
</style></head><body><main><h1>Food and cycle symbols</h1><p>The same bicycle geometry goes into the HUD and onto the lane. Food uses a fork and knife, with room between the utensils.</p><div class="cards"><section class="card"><strong>Food</strong><div class="samples" id="food"></div></section><section class="card"><strong>Bicycle</strong><div class="samples" id="bicycle"></div></section></div><nav aria-label="Paint viewing angle"><button aria-pressed="true" data-view="0">Front</button><button aria-pressed="false" data-view="1.5707963267948966">Right</button><button aria-pressed="false" data-view="3.141592653589793">Back</button><button aria-pressed="false" data-view="4.71238898038469">Left</button></nav><canvas aria-label="Cycle symbols projected on both directions of a real cycle lane"></canvas><p id="status">Preparing actual street paint…</p></main><script type="module" src="./symbols.js"></script></body></html>
