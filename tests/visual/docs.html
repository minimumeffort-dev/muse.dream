<!doctype html><html><head><meta charset="utf-8"><title>Dream 2 source and asset</title>
<link rel="stylesheet" href="/docs/site/style.css"><style>
body{height:100vh;display:grid;grid-template-rows:auto minmax(0,1fr)}
header{padding:24px 32px;display:flex;align-items:baseline;gap:24px;border-bottom:1px solid var(--line)}
h1{font:650 25px/1.4 var(--font-display);margin:0}header span{color:var(--ink-soft)}
