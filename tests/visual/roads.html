<!doctype html><html><head><meta charset="utf-8"><title>World geometry review</title><style>
body{margin:0;height:100vh;display:flex;flex-direction:column;background:#263c45;color:#e8e6da;font:15px system-ui}header{padding:14px;display:flex;flex:none;flex-wrap:wrap;gap:12px;align-items:center}select{font:inherit;padding:7px}canvas{display:block;width:100%;flex:1;min-height:0;height:0}
</style></head><body><header><select id="location" aria-label="Location"></select><select id="view" aria-label="View"><option value="0">Front</option><option value="1.57079632679">Right</option><option value="3.14159265359">Back</option><option value="4.71238898038">Left</option></select><select id="pitch" aria-label="Pitch"><option value="1000">Game height</option><option value="260">Side inspection</option></select><label>Shadows <select aria-label="Shadows" id="shadows"><option value="stable">Stable</option><option value="previous">Previous</option><option value="off">Off</option></select></label><select aria-label="Zoom" id="zoom"><option value="1">1×</option><option value="2">2×</option><option value="4">4×</option></select><label>Pan <input id="pan" aria-label="Pan" type="range" min="-180" max="180" value="0"></label><select id="hour" aria-label="Time of day"><option value="10">Day · 10:00</option><option value="6.5">Dawn · 06:30</option><option value="17.5">Dusk · 17:30</option><option value="22">Night · 22:00</option></select><button id="motion">Pause animation</button></header><canvas></canvas><script type="module" src="./roads.js"></script></body></html>
